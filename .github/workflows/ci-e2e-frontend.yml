name: CI - Frontend E2E Tests

on:
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-e2e-frontend.yml'

jobs:
  run-e2e-tests:
    name: 🧪 Run Cypress E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          # Bind and wait on 127.0.0.1 explicitly: "localhost" may resolve to
          # IPv4 or IPv6 depending on the Node version, so wait-on and Vite
          # could end up on different addresses.
          start: npm run dev -- --host 127.0.0.1 --strictPort
          wait-on: 'http://127.0.0.1:5173'
          working-directory: ./frontend
        env:
          CYPRESS_baseUrl: http://127.0.0.1:5173
          # Fake API host: every request must be stubbed with cy.intercept,
          # so tests never reach the real backend. The app (VITE_API_URL)
          # and the specs (CYPRESS_apiUrl) must point to the same host.
          VITE_API_URL: http://api.test
          CYPRESS_apiUrl: http://api.test
