name: CI - Frontend E2E Tests

on:
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-e2e-frontend.yml'

jobs:
  run-e2e-tests:
    name: 🧪 Run Cypress E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run Cypress E2E Tests
        # v7.4.4+ is required: v6 bundles got@11, whose wait-on gives up on the
        # first poll on current runners (ERR_SOCKET_CLOSED_BEFORE_CONNECTION).
        uses: cypress-io/github-action@v7
        with:
          start: npm run dev
          wait-on: 'http://localhost:5173'
          working-directory: ./frontend
        env:
          # Fake API host: every request must be stubbed with cy.intercept,
          # so tests never reach the real backend. The app (VITE_API_URL)
          # and the specs (CYPRESS_apiUrl) must point to the same host.
          VITE_API_URL: http://api.test
          CYPRESS_apiUrl: http://api.test
